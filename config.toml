[bot]
zalo_api_base = "https://bot-api.zaloplatforms.com"
zalo_poll_timeout_secs = 30
state_path = "data/state.json"

[intervals]
giftcodes_secs = 3600
news_secs = 1800

[genshin]
fandom_api_url = "https://genshin-impact.fandom.com/api.php?action=query&prop=revisions&titles=Promotional_Code&rvprop=content&rvslots=main&format=json"
allowed_servers = ["SEA", "G", "A"]

